<title>추출 기록 계산기</title>
<meta name="description" content="분쇄도·TDS·서빙을 넣으면 수율을 계산하고 SCA 차트에 기록하며 다음 분쇄도를 조언하는 오프라인 계산기.">
<style>
  :root{
    color-scheme:dark;
    /* 잉크 */
    --ink:#F3F7FC; --ink-2:#AFC0D6; --steel:#8598B2; --steel-2:#7A8DA5;
    /* 블루 액센트 */
    --acc:#4C9BFF; --acc-2:#7BB6FF; --acc-deep:#1E6BFF; --cyan:#35D6F5; --violet:#8B7BFF;
    --acc-wash:rgba(76,155,255,.16); --on-acc:#04101F; --tgt-c:#FF5A52;
    /* 의미색 */
    --good:#4FE0A6; --good-wash:rgba(79,224,166,.14);
    --warn:#FFC46B; --warn-wash:rgba(255,196,107,.14);
    --bad:#FF8E85;  --bad-wash:rgba(255,142,133,.14);
    /* 표면 */
    --ground:#05070C;
    --panel:rgba(12,20,36,.62);
    --panel-2:rgba(255,255,255,.045);
    --brd:rgba(140,180,255,.17);
    --brd-soft:rgba(140,180,255,.10);
    --spec:rgba(255,255,255,.34);
    --rule:rgba(140,180,255,.14);
    --rule-soft:rgba(140,180,255,.075);
    --surface:#0B1220;
    --surface-2:rgba(255,255,255,.05);
    --blur:34px; --blur-lite:18px;
    --r-lg:26px; --r-md:18px;
    --display:"Helvetica Neue","Inter","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Menlo","Consolas",monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--ground); color:var(--ink);
    font-family:var(--body); font-size:16px; line-height:1.62; margin:0;
    -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; word-break:keep-all;
    min-height:100vh; position:relative; overflow-x:hidden;
  }
  /* 앰비언트 그라디언트 — 글래스가 굴절할 대상 */
  body::before{
    content:""; position:fixed; inset:-25%; z-index:-2; pointer-events:none;
    background:
      radial-gradient(46vw 46vw at 10% 0%,  rgba(30,107,255,.20) 0%, transparent 62%),
      radial-gradient(44vw 44vw at 94% 18%, rgba(120,110,235,.14) 0%, transparent 64%),
      radial-gradient(44vw 44vw at 50% 100%,rgba(76,155,255,.16) 0%, transparent 64%);
    filter:blur(80px);
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 0%, transparent 30%, rgba(5,7,12,.72) 100%);
  }

  .wrap{max-width:1000px;width:100%;min-width:0;margin:0 auto;padding:30px 18px 84px;display:flex;flex-direction:column;gap:20px}
  h1{font-family:var(--display);font-size:clamp(1.85rem,5vw,2.5rem);font-weight:700;letter-spacing:-0.042em;line-height:1.06;margin:0}
  h2{font-family:var(--display);font-size:1rem;font-weight:600;letter-spacing:-0.01em;margin:0;padding-left:6px;color:var(--ink-2)}
  p{margin:0}
  .eyebrow{font-family:var(--mono);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--acc-2);margin:0;opacity:.9}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  strong{font-weight:700;color:var(--ink)}
  header{display:flex;flex-direction:column;gap:8px;padding:8px 6px 2px}
  section{display:flex;flex-direction:column;gap:10px;min-width:0}

  /* ── 글래스 카드 : 내부 그라디언트 발광 + 컬러 글로우 ── */
  .card{
    position:relative; min-width:0; border-radius:var(--r-lg); isolation:isolate;
    background:
      linear-gradient(180deg, rgba(76,155,255,0) 0%, rgba(76,155,255,.09) 50%, rgba(104,176,255,.27) 100%)
        bottom center / 100% 84px no-repeat,
      linear-gradient(180deg, rgba(11,18,32,.94) 0%, rgba(7,12,24,.95) 58%, rgba(6,10,20,.96) 100%);
    -webkit-backdrop-filter:blur(20px);
    backdrop-filter:blur(20px);
    border:1px solid rgba(120,170,255,.13);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.09),
      inset -1px 0 0 rgba(130,180,255,.07),
      inset 0 -1px 0 rgba(110,175,255,.30),
      0 22px 46px -26px rgba(30,107,255,.40),
      0 2px 12px rgba(0,0,0,.55);
  }
  .card > *{position:relative;z-index:1}
  .card > :last-child{border-bottom-left-radius:var(--r-lg);border-bottom-right-radius:var(--r-lg)}

  /* ── 입력 ── */
  form{display:flex;flex-direction:column;gap:0}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:1px;background:var(--brd-soft);
    border-radius:var(--r-lg) var(--r-lg) 0 0;overflow:hidden}
  .f{background:rgba(6,10,20,.34);padding:13px 15px 15px;display:flex;flex-direction:column;gap:5px;min-width:0}
  .f label{font-family:var(--mono);font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;color:var(--steel)}
  .f input{font-family:var(--mono);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-0.015em;
    background:transparent;border:0;border-bottom:1px solid var(--rule);color:var(--ink);padding:3px 0 5px;width:100%;min-width:0}
  .f input[type=text]{font-family:var(--body);font-weight:500;font-size:16px}
  .f input:focus{outline:0;border-bottom:2px solid var(--acc);padding-bottom:4px}
  .f input::placeholder{color:var(--steel-2);font-weight:400}

  .frow{display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:15px}
  button{
    font-family:var(--body);font-size:.88rem;font-weight:600;line-height:1.2;cursor:pointer;
    padding:12px 21px;border-radius:999px;color:var(--ink);
    background:rgba(255,255,255,.055);
    border:1px solid var(--brd);
    -webkit-backdrop-filter:blur(var(--blur-lite)) saturate(180%);
    backdrop-filter:blur(var(--blur-lite)) saturate(180%);
    box-shadow:inset 0 1px 0 var(--spec), 0 4px 16px -8px rgba(0,0,0,.7);
    transition:transform .16s ease, filter .16s ease, box-shadow .16s ease;
  }
  button:hover{filter:brightness(1.14)}
  button:active{transform:scale(.962)}
  button.primary{
    background:var(--acc); border-color:rgba(255,255,255,.24); color:var(--on-acc); font-weight:700;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.42), 0 6px 20px -10px rgba(76,155,255,.7);
  }
  button.ghost{background:rgba(255,255,255,.03)}
  button:focus-visible,input:focus-visible,.del:focus-visible{outline:2px solid var(--acc-2);outline-offset:3px}
  .hint{font-size:.78rem;color:var(--steel);flex:1 1 180px;min-width:140px}
  .hint.err{color:var(--bad);font-weight:600}

  /* ── 목표 ── */
  /* 목표 슬라이더 — 현재 비율선 위, SCA Ideal 구간만 이동 */
  .tslide{display:flex;align-items:center;gap:12px;padding:4px 18px 12px}
  .tslide label{font-family:var(--mono);font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;
    color:var(--tgt-c);font-weight:700;white-space:nowrap}
  .tslide input[type=range]{
    -webkit-appearance:none;appearance:none;flex:1 1 auto;min-width:0;height:26px;
    background:transparent;cursor:pointer;margin:0}
  .tslide input[type=range]::-webkit-slider-runnable-track{
    height:4px;border-radius:999px;background:rgba(140,180,255,.22)}
  .tslide input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;
    background:var(--tgt-c);border:2px solid #0A1220;margin-top:-7px;
    box-shadow:0 0 0 1px rgba(255,255,255,.18)}

<div class="wrap">

<script>
(function(){
  "use strict";
  var BOX={eLo:18,eHi:22,tLo:1.15,tHi:1.45}, SENS_DEF=0.6, KEY="brewcalc.v1";
  var S={rec:[],sel:null,tEy:20.0,tTds:1.40};

  function enc(){
    return "*|"+S.tEy+"|"+S.tTds+";"+S.rec.map(function(r){
      return [String(r.bean).replace(/[|;#]/g,""),r.grind,r.tds,r.bev,r.dose,r.water].join("|");
    }).join(";");
  }
  function dec(t){
    var parts=t.split(";").filter(Boolean);
    if(parts.length && parts[0].charAt(0)==="*"){
      var tp=parts.shift().split("|");
      var a=parseFloat(tp[1]), b=parseFloat(tp[2]);
      if(isFinite(a)) S.tEy=a;
      if(isFinite(b)) S.tTds=b;
    }
    return parts.map(function(x,i){
      var p=x.split("|");
      return {id:"h"+i+"_"+Math.random().toString(36).slice(2,6),bean:decodeURIComponent(p[0]||"원두"),
              grind:+p[1],tds:+p[2],bev:+p[3],dose:+p[4],water:+p[5]};
    }).filter(function(r){
      return isFinite(r.grind)&&isFinite(r.tds)&&isFinite(r.bev)&&r.dose>0&&r.water>0;
    });
  }
  function load(){
    var h=(location.hash||"").replace(/^#d=/,"");
    if(h && location.hash.indexOf("#d=")===0){
      try{ S.rec=dec(decodeURIComponent(h)); if(S.rec.length) return; }catch(e){}
    }
    try{var r=localStorage.getItem(KEY);if(r)S.rec=JSON.parse(r)||[];}catch(e){}
  }
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(S.rec));}catch(e){}
    var frag="#d="+encodeURIComponent(enc());
    try{ history.replaceState(null,"",location.pathname+location.search+frag); }
    catch(e){ try{ location.hash="d="+encodeURIComponent(enc()); }catch(e2){} }
  }
  function copyLink(){
    var url=location.href, btn=document.getElementById("b-copy");
    function done(ok){ btn.textContent=ok?"복사됨":"복사 실패"; setTimeout(function(){btn.textContent="링크 복사";},1600); }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){done(true);},function(){done(false);});
    }else{
      try{ var ta=document.createElement("textarea"); ta.value=url;
        ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
        ta.select(); var ok=document.execCommand("copy"); document.body.removeChild(ta); done(ok);
      }catch(e){ done(false); }
    }
  }

  function calc(r){
    var ey=r.tds*r.bev/r.dose, ratio=r.water/r.dose, ret=(r.water-r.bev)/r.dose;
    return {ey:ey,ratio:ratio,ret:ret};
  }
  function verdict(ey,tds){
    if(ey<BOX.eLo) return {k:"under",l:"과소추출"};
    if(ey>BOX.eHi) return {k:"over",l:"과다추출"};
    if(tds>BOX.tHi) return {k:"strong",l:"농도 초과 (Strong)"};
    if(tds<BOX.tLo) return {k:"weak",l:"농도 부족 (Weak)"};
    return {k:"ideal",l:"SCA Ideal"};
  }
  function sens(bean){
    var pool=S.rec.filter(function(r){return r.bean===bean;});
    if(new Set(pool.map(function(r){return r.grind;})).size<2) pool=S.rec;
    var gs=new Set(pool.map(function(r){return r.grind;}));
    if(gs.size<2) return {v:SENS_DEF,src:"기본값 (기록 2점 이상이면 자동 산출)"};
    var n=pool.length,mx=0,my=0;
    pool.forEach(function(r){mx+=r.grind;my+=calc(r).ey;});
    mx/=n; my/=n;
    var num=0,den=0;
    pool.forEach(function(r){var dx=r.grind-mx;num+=dx*(calc(r).ey-my);den+=dx*dx;});
    if(den===0) return {v:SENS_DEF,src:"기본값"};
    var s=-(num/den);
    if(!(s>0)) return {v:SENS_DEF,src:"기본값 (추세가 뒤집혀 있어 미사용)"};
    var cl=Math.min(1.5,Math.max(0.2,s));
    return {v:cl,src:"실측 "+n+"점에서 산출"+(cl!==s?" (범위 제한 적용)":"")};
  }
  function fmt(x,d){return x.toFixed(d===undefined?2:d);}

  /* 현재 레시피(비율)에서 목표가 움직일 수 있는 구간.
     비율이 고정되면 TDS = 수율 x 도징 / 서빙 로 묶이므로 자유도는 1개다. */
  function tctx(){
    var last=S.rec[S.rec.length-1], dose, bev;
    if(last){ dose=last.dose; bev=last.bev; }
    else{
      dose=parseFloat(document.getElementById("i-dose").value)||15;
      var w=parseFloat(document.getElementById("i-water").value)||250;
      bev=w-dose*2.4;
    }
    if(!(bev>0)) bev=dose*14;
    var lo=Math.max(BOX.eLo, BOX.tLo*bev/dose);
    var hi=Math.min(BOX.eHi, BOX.tHi*bev/dose);
    if(hi<lo){ var m=(lo+hi)/2; lo=m; hi=m; }
    return {dose:dose,bev:bev,lo:lo,hi:hi};
  }
  function syncTarget(){
    var c=tctx();
    if(!isFinite(S.tEy)) S.tEy=20;
    S.tEy=Math.min(c.hi,Math.max(c.lo,S.tEy));
    S.tTds=S.tEy*c.dose/c.bev;
    return c;
  }

  function advise(r){
    var c=calc(r), v=verdict(c.ey,r.tds), sn=sens(r.bean);
    var hiByTds=BOX.tHi*r.bev/r.dose, loByTds=BOX.tLo*r.bev/r.dose;
    var reachHi=Math.min(BOX.eHi,hiByTds), reachLo=Math.max(BOX.eLo,loByTds);
    var out={v:v,sens:sn,lines:[]};
    if(reachLo>reachHi){
      out.v={k:"ratio",l:"이 비율로는 박스 진입 불가"};
      var needBev=BOX.eLo*r.dose/BOX.tHi, needW=needBev+c.ret*r.dose;
      out.lines.push({big:true,t:"비율을 <strong>1:"+fmt(needW/r.dose,1)+"</strong> 이상으로 묽게 가져가세요."});
      out.lines.push({t:"현재 비율 1:"+fmt(c.ratio,1)+"에서는 수율 "+fmt(BOX.eLo,0)+"%에 닿기 전에 TDS가 "+fmt(BOX.tHi,2)+"%를 넘습니다."});
      return out;
    }
    var target=S.tEy;
    var d=(target-c.ey)/sn.v;
    var ng=r.grind-d;
    var projTds=target*r.dose/r.bev;
    if(Math.abs(d)<0.15){
      out.lines.push({big:true,t:"현재 분쇄도 <strong>"+fmt(r.grind,2)+"</strong>을 유지하세요. 목표 지점입니다."});
    }else if(d>0){
      out.lines.push({big:true,t:"분쇄도를 <strong>"+fmt(ng,2)+"</strong>으로 <strong>"+fmt(d,2)+"넘버 가늘게</strong>."});
    }else{
      out.lines.push({big:true,t:"분쇄도를 <strong>"+fmt(ng,2)+"</strong>으로 <strong>"+fmt(-d,2)+"넘버 굵게</strong>."});
    }
    out.lines.push({t:"목표 수율 <strong>"+fmt(target)+"%</strong> · 이 비율에서 TDS <strong>"+fmt(projTds)+"%</strong>"});
    if(v.k==="strong"){
      var bev2=c.ey*r.dose/1.40, w2=bev2+c.ret*r.dose;
      out.lines.push({t:"수율을 지키면서 농도만 낮추려면 비율을 <strong>1:"+fmt(w2/r.dose,1)+"</strong>로 묽게 하는 방법도 있습니다."});
    }
    if(v.k==="weak"){
      var bev3=c.ey*r.dose/1.25, w3=bev3+c.ret*r.dose;
      out.lines.push({t:"농도만 올리려면 비율을 <strong>1:"+fmt(w3/r.dose,1)+"</strong>로 조이는 방법도 있습니다."});
    }
    out.lines.push({t:"이 비율에서 박스 안 수율 범위는 <strong>"+fmt(reachLo)+"% ~ "+fmt(reachHi)+"%</strong>입니다."});
    return out;
  }

  // ---- chart ----
  var EL=14,EH=26,TL=0.90,TH=1.80;
  var X0,X1,Y0,Y1,G;
  function geo(){
    var el=document.getElementById("chart");
    var w=(el&&el.parentNode&&el.parentNode.clientWidth)||window.innerWidth||900;
    return (w<560)
      ? {nw:true,  X0:132,X1:832,Y0:64,Y1:700,H:888, xStep:4,tStep:0.20,gx:1,gt:0.10, r:11,ring:16,hit:30, corners:false,ratioLbl:false}
      : {nw:false, X0:78, X1:812,Y0:44,Y1:620,H:712, xStep:2,tStep:0.10,gx:0.5,gt:0.05, r:5, ring:7.5,hit:15, corners:true, ratioLbl:true};
  }
  function sx(e){return X0+(e-EL)/(EH-EL)*(X1-X0);}
  function sy(t){return Y0+(TH-t)/(TH-TL)*(Y1-Y0);}
  function clip(k){
    var p=[],e,t;
    for(var i=0;i<2;i++){e=i?EH:EL;t=e*k;if(t>=TL&&t<=TH)p.push([e,t]);}
    for(var j=0;j<2;j++){t=j?TH:TL;e=t/k;if(e>=EL&&e<=EH)p.push([e,t]);}
    p.sort(function(a,b){return a[0]-b[0];});
    return p.length>=2?[p[0],p[p.length-1]]:null;
  }
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function near(a,b,tol){return Math.abs(a-b)<(tol||1e-6);}

  function chart(){
    G=geo(); X0=G.X0; X1=G.X1; Y0=G.Y0; Y1=G.Y1;
    var svg=document.getElementById("chart");
    svg.setAttribute("viewBox","0 0 860 "+G.H);
    if(G.nw){svg.classList.add("nw");}else{svg.classList.remove("nw");}

    var g=[],i,t,e;
    var sd=G.nw?7:3.5;
    g.push('<defs><filter id="glw" x="-60%" y="-60%" width="220%" height="220%">'+
           '<feGaussianBlur stdDeviation="'+sd+'" result="b"/>'+
           '<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>'+
           '</filter></defs>');
    for(e=EL;e<=EH+1e-9;e+=G.gx){g.push('<line class="gmin" x1="'+sx(e).toFixed(1)+'" y1="'+Y0+'" x2="'+sx(e).toFixed(1)+'" y2="'+Y1+'"/>');}
    for(t=TL;t<=TH+1e-9;t+=G.gt){g.push('<line class="gmin" x1="'+X0+'" y1="'+sy(t).toFixed(1)+'" x2="'+X1+'" y2="'+sy(t).toFixed(1)+'"/>');}
    g.push('<rect class="zone" x="'+sx(18).toFixed(1)+'" y="'+sy(1.45).toFixed(1)+'" width="'+(sx(22)-sx(18)).toFixed(1)+'" height="'+(sy(1.15)-sy(1.45)).toFixed(1)+'"/>');
    [18,22].forEach(function(x){g.push('<line class="gdiv" x1="'+sx(x).toFixed(1)+'" y1="'+Y0+'" x2="'+sx(x).toFixed(1)+'" y2="'+Y1+'"/>');});
    [1.15,1.45].forEach(function(y){g.push('<line class="gdiv" x1="'+X0+'" y1="'+sy(y).toFixed(1)+'" x2="'+X1+'" y2="'+sy(y).toFixed(1)+'"/>');});

    var last=S.rec[S.rec.length-1];
    var dose=last?last.dose:15, retg=2.5;
    if(S.rec.length){var sm=0;S.rec.forEach(function(r){sm+=calc(r).ret;});retg=sm/S.rec.length;}
    var curR=last?calc(last).ratio:null;
    var list=[14,15,16,17,18,19,20,21,22];
    if(curR&&list.indexOf(Math.round(curR*10)/10)<0) list.push(Math.round(curR*10)/10);
    list.sort(function(a,b){return a-b;});
    list.forEach(function(R){
      var bev=dose*R-retg*dose; if(bev<=0) return;
      var k=dose/bev, sg=clip(k); if(!sg) return;
      var hl=curR!==null&&near(R,curR,0.06);
      var nm="1:"+(R%1?R.toFixed(1):R);
      g.push('<line class="'+(hl?"rhl":"rline")+'" x1="'+sx(sg[0][0]).toFixed(1)+'" y1="'+sy(sg[0][1]).toFixed(1)+'" x2="'+sx(sg[1][0]).toFixed(1)+'" y2="'+sy(sg[1][1]).toFixed(1)+'"/>');
      if(!hl && !G.ratioLbl) return;
      var e2=sg[1][0],t2=sg[1][1],a2=(e2>=EH-0.01)?"end":"middle",dx=(a2==="end")?-6:0,dy=(a2==="end")?-8:-9;
      g.push('<text class="'+(hl?"rlblhl":"rlbl")+'" x="'+(sx(e2)+dx).toFixed(1)+'" y="'+(sy(t2)+dy).toFixed(1)+'" text-anchor="'+a2+'">'+nm+'</text>');
    });

    var zones = G.corners
      ? [[16,1.62,"Strong & Under"],[20,1.62,"Strong"],[24,1.62,"Strong & Over"],
         [16,1.30,"과소추출"],[24,1.30,"과다추출"],
         [16,1.02,"Weak & Under"],[20,1.02,"Weak"],[24,1.02,"Weak & Over"]]
      : [[16,1.62,"진하고 덜 뽑힘"],[24,1.62,"진하고 더 뽑힘"],
         [16,1.30,"과소추출"],[24,1.30,"과다추출"],
         [16,1.02,"묽고 덜 뽑힘"],[24,1.02,"묽고 더 뽑힘"]];
    zones.forEach(function(z){
      g.push('<text class="zlbl" x="'+sx(z[0]).toFixed(1)+'" y="'+sy(z[1]).toFixed(1)+'" text-anchor="middle">'+esc(z[2])+'</text>');
    });
    g.push('<text class="zideal" x="'+sx(20).toFixed(1)+'" y="'+sy(1.22).toFixed(1)+'" text-anchor="middle">SCA IDEAL</text>');

    g.push('<line class="axis" x1="'+X0+'" y1="'+Y1+'" x2="'+X1+'" y2="'+Y1+'"/>');
    g.push('<line class="axis" x1="'+X0+'" y1="'+Y0+'" x2="'+X0+'" y2="'+Y1+'"/>');
    for(i=EL;i<=EH;i++){
      var lb=((i-EL)%G.xStep)===0;
      g.push('<line class="tick" x1="'+sx(i).toFixed(1)+'" y1="'+Y1+'" x2="'+sx(i).toFixed(1)+'" y2="'+(Y1+(lb?(G.nw?12:6):(G.nw?6:3)))+'"/>');
      if(lb) g.push('<text class="atick" x="'+sx(i).toFixed(1)+'" y="'+(Y1+(G.nw?42:22))+'" text-anchor="middle">'+i+'%</text>');
    }
    for(t=1.00;t<=TH+1e-9;t+=0.05){
      var cc=Math.round(t*100), lb2 = G.nw ? (cc%20===0) : (cc%10===0);
      g.push('<line class="tick" x1="'+(X0-(lb2?(G.nw?12:6):(G.nw?6:3)))+'" y1="'+sy(t).toFixed(1)+'" x2="'+X0+'" y2="'+sy(t).toFixed(1)+'"/>');
      if(lb2) g.push('<text class="atick" x="'+(X0-(G.nw?20:11))+'" y="'+(sy(t)+(G.nw?9:4)).toFixed(1)+'" text-anchor="end">'+t.toFixed(2)+'</text>');
    }
    g.push('<text class="axtitle" x="'+((X0+X1)/2).toFixed(1)+'" y="'+(Y1+(G.nw?88:52))+'" text-anchor="middle">추출 수율 (%)</text>');
    g.push('<text class="axtitle" transform="translate('+(G.nw?34:24)+','+((Y0+Y1)/2).toFixed(1)+') rotate(-90)" text-anchor="middle">농도 TDS (%)</text>');

    if(S.tEy>=EL&&S.tEy<=EH&&S.tTds>=TL&&S.tTds<=TH){
      var tx=sx(S.tEy), ty=sy(S.tTds);
      g.push('<circle class="tgtring" cx="'+tx.toFixed(1)+'" cy="'+ty.toFixed(1)+'" r="'+(G.nw?13:6.5)+'"/>');
      g.push('<circle class="tgtdot"  cx="'+tx.toFixed(1)+'" cy="'+ty.toFixed(1)+'" r="'+(G.nw?9:4.5)+'"/>');
    }

    S.rec.forEach(function(r,i){
      var c=calc(r); if(c.ey<EL-2||c.ey>EH+2||r.tds<TL-.1||r.tds>TH+.1) return;
      var cx=Math.max(X0,Math.min(X1,sx(c.ey))), cy=Math.max(Y0,Math.min(Y1,sy(r.tds)));
      var newest=(i===S.rec.length-1), selc=(S.sel===r.id);
      g.push('<circle class="hit" data-id="'+r.id+'" cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+G.hit+'"><title>'+
        esc(r.bean)+' · 분쇄도 '+r.grind+' · 수율 '+fmt(c.ey)+'% · TDS '+fmt(r.tds)+'% · 서빙 '+r.bev+'g</title></circle>');
      g.push('<circle class="ring" cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+G.ring+'"/>');
      g.push('<circle class="pt'+(newest?"":" old")+(selc?" sel":"")+'"'+(newest?' filter="url(#glw)"':'')+' cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+G.r+'"/>');
      g.push('<text class="plbl" x="'+(cx+(G.nw?24:12)).toFixed(1)+'" y="'+(cy+(G.nw?9:4)).toFixed(1)+'">'+(i+1)+'</text>');
    });
    svg.innerHTML=g.join("");
    document.getElementById("lg-ratio").textContent=curR?("현재 1:"+fmt(curR,1)):"현재 비율";
  }

  function render(){
    var c0=syncTarget(), sl=document.getElementById("i-tgt");
    sl.min=c0.lo.toFixed(2); sl.max=c0.hi.toFixed(2); sl.step="0.05";
    sl.value=S.tEy.toFixed(2);
    sl.disabled=(c0.hi-c0.lo)<0.01;
    document.getElementById("tgt-val").textContent=
      "수율 "+fmt(S.tEy)+"% · TDS "+fmt(S.tTds)+"%";
    var tb=document.getElementById("tb"), rows=[];
    S.rec.forEach(function(r,i){
      var c=calc(r), v=verdict(c.ey,r.tds), newest=(i===S.rec.length-1);
      rows.push('<tr data-id="'+r.id+'" class="'+(S.sel===r.id?"sel":"")+'">'+
        '<td class="n"><span class="idx'+(newest?"":" old")+'">'+(i+1)+'</span></td>'+
        '<td>'+esc(r.bean)+'</td>'+
        '<td class="n">'+fmt(r.grind,2)+'</td><td class="n">'+fmt(r.tds)+'%</td>'+
        '<td class="n">'+fmt(r.bev,0)+'g</td><td class="n">1:'+fmt(c.ratio,1)+'</td>'+
        '<td class="n"><strong>'+fmt(c.ey)+'%</strong></td>'+
        '<td class="n"><span class="vs v-'+v.k+'">'+esc(v.l)+'</span></td>'+
        '<td class="n"><button class="del" data-del="'+r.id+'" aria-label="'+(i+1)+'번 기록 삭제" title="삭제">&times;</button></td></tr>');
    });
    tb.innerHTML=rows.join("");
    document.getElementById("empty").hidden=S.rec.length>0;

    var sec=document.getElementById("sec-res");
    var target=S.sel?S.rec.filter(function(r){return r.id===S.sel;})[0]:S.rec[S.rec.length-1];
    if(!target){sec.hidden=true;chart();return;}
    sec.hidden=false;
    var c=calc(target), a=advise(target);
    document.getElementById("res-title").textContent=target.bean+" · 분쇄도 "+fmt(target.grind,2);
    document.getElementById("res").innerHTML=
      '<div class="rc key"><dt>수율</dt><dd>'+fmt(c.ey)+'%</dd></div>'+
      '<div class="rc key"><dt>TDS</dt><dd>'+fmt(target.tds)+'%</dd></div>'+
      '<div class="rc"><dt>비율</dt><dd>1:'+fmt(c.ratio,1)+'</dd></div>'+
      '<div class="rc"><dt>서빙</dt><dd>'+fmt(target.bev,0)+'g</dd></div>'+
      '<div class="rc"><dt>고형분</dt><dd>'+fmt(target.tds/100*target.bev,2)+'g</dd></div>'+
      '<div class="rc"><dt>보유수</dt><dd>'+fmt(c.ret)+'</dd></div>';
    var h='<span class="vtag v-'+a.v.k+'">'+esc(a.v.l)+'</span>';
    a.lines.forEach(function(l){h+='<p'+(l.big?' class="big"':'')+'>'+l.t+'</p>';});
    h+='<p class="sens">감도 '+fmt(a.sens.v)+'pp / 넘버 — '+esc(a.sens.src)+'</p>';
    document.getElementById("adv").innerHTML=h;
    chart();
  }

  document.getElementById("fm").addEventListener("submit",function(ev){
    ev.preventDefault();
    var g=parseFloat(document.getElementById("i-grind").value),
        td=parseFloat(document.getElementById("i-tds").value),
        bv=parseFloat(document.getElementById("i-bev").value),
        ds=parseFloat(document.getElementById("i-dose").value),
        wt=parseFloat(document.getElementById("i-water").value),
        bn=document.getElementById("i-bean").value.trim()||"원두";
    var hint=document.getElementById("hint");
    if(!isFinite(g)||!isFinite(td)||!isFinite(bv)||!isFinite(ds)||!isFinite(wt)||ds<=0||bv<=0){
      hint.className="hint err"; hint.textContent="분쇄도·TDS·서빙 숫자를 채워주세요."; return;
    }
    if(bv>wt){hint.className="hint err"; hint.textContent="서빙("+bv+"g)이 물("+wt+"g)보다 많습니다."; return;}
    hint.className="hint"; hint.innerHTML="기록은 자동 저장되고 주소에도 담깁니다. <strong>링크 복사</strong>로 백업하세요.";
    S.rec.push({id:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      bean:bn,grind:g,tds:td,bev:bv,dose:ds,water:wt});
    S.sel=null; save(); render();
    document.getElementById("i-tds").value="";document.getElementById("i-bev").value="";
    document.getElementById("i-grind").focus();
  });

  var _rt;
  window.addEventListener("resize",function(){clearTimeout(_rt);_rt=setTimeout(chart,150);});
  window.addEventListener("orientationchange",function(){setTimeout(chart,300);});
  document.getElementById("i-tgt").addEventListener("input",function(ev){
    var v=parseFloat(ev.target.value);
    if(isFinite(v)){ S.tEy=v; save(); render(); }
  });
  ["i-dose","i-water"].forEach(function(id){
    document.getElementById(id).addEventListener("input",function(){ if(!S.rec.length) render(); });
  });
  document.getElementById("b-copy").addEventListener("click",copyLink);
  document.getElementById("b-reset").addEventListener("click",function(){
    if(S.rec.length&&!confirm("기록을 모두 지울까요?"))return;
    S.rec=[];S.sel=null;save();render();
  });
  document.getElementById("tb").addEventListener("click",function(ev){
    var d=ev.target.closest("[data-del]");
    if(d){var id=d.getAttribute("data-del");
      S.rec=S.rec.filter(function(r){return r.id!==id;});
      if(S.sel===id)S.sel=null; save(); render(); return;}
    var tr=ev.target.closest("tr[data-id]");
    if(tr){var i2=tr.getAttribute("data-id"); S.sel=(S.sel===i2)?null:i2; render();}
  });
  document.getElementById("chart").addEventListener("click",function(ev){
    var h=ev.target.closest("[data-id]"); if(!h)return;
    var id=h.getAttribute("data-id"); S.sel=(S.sel===id)?null:id; render();
  });

  load();
  render();
})();
</script>
</body>
</html>
